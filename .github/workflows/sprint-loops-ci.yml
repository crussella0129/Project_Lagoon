name: Instrument checks
on:
  push:
    branches: [main, codex/dev]
  pull_request:
    branches: [main, codex/dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The support floor is current stable; no historical MSRV is promised.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
      - run: uv sync --project analysis --locked --python 3.12
      - run: uv run --project analysis --locked ruff format --check analysis conformance
      - run: uv run --project analysis --locked ruff check analysis conformance
      - run: uv run --project analysis --locked python -m unittest discover -s conformance -v
      - run: uv run --project analysis --locked python -m unittest discover -s analysis -v
      - run: uv run --project analysis --locked python analysis/recover.py --binary target/debug/lovers-lagoon --output target/recovery-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-recovery-receipts
          path: |
            target/recovery-ci/recovery-spec.json
            target/recovery-ci/recovery-report.json
            target/recovery-ci/failure.json
